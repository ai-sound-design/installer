# Builds the macOS installer app on GitHub's Macs and attaches it to the release.
#
# To publish a version: set it in VERSION, commit, then push a tag (from any computer):
#   git tag v1.0.1
#   git push origin v1.0.1
# The release v1.0.1 then gets AI-Sound-Design-Installer-macOS.zip, and installed
# installers offer to update themselves to it.
name: Release macOS installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to (e.g. v1.0.1)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          bash macos/build.sh "${TAG#v}"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          ZIP=macos/build/AI-Sound-Design-Installer-macOS.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "AI Sound Design Installer ${TAG#v}" \
              --notes "Download AI-Sound-Design-Installer-macOS.zip, open it and double-click the app. The first time, macOS refuses to open it: System Settings > Privacy & Security > Open Anyway."
          fi
